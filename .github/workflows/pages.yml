name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARYEN_VERSION: 133

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Версия CLI обязана совпадать с крейтом wasm-bindgen из Cargo.lock
      - name: Detect wasm-bindgen version
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "WASM_BINDGEN_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}

      # binaryen из apt слишком старый для wasm свежего Rust
      - name: Install binaryen
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: ./build.sh

      - name: Assemble site
        run: |
          mkdir -p _site/pkg
          cp index.html style.css favicon.ico sitemap.xml script.js worker.js _site/
          cp pkg/galileos2dicom_web.js pkg/galileos2dicom_web_bg.wasm _site/pkg/

      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
